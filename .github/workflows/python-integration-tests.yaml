name: Python Integration Tests

on:
  push:
    branches: [ main, testes_integracao ]
  pull_request:
    branches: [ main ]
    paths:
      - "src/**/*.py"
      - "tests/integration/**/*.py"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-interaction --extras dev

      - name: Create test data directories
        run: |
          mkdir -p data/bronze
          mkdir -p data/silver
          mkdir -p data/gold
          mkdir -p cache

      # Coverage is reported here but gated in python-unit-tests.yaml: the
      # integration suite alone covers ~27% of coops, so a threshold here
      # could never pass.
      - name: Run integration tests with coverage
        run: |
          poetry run pytest tests/integration \
            --cov=coops \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v \
            --tb=short

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: integration
          name: integration-coverage
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: integration-coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Integration test summary
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Python version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test suite: Integration tests" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: reported only (gated by the unit test workflow)" >> $GITHUB_STEP_SUMMARY

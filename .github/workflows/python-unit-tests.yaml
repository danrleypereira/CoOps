name: Unit Tests (Python + Frontend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "phase/**" ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**/*.py"
      - ".github/workflows/python-unit-tests.yaml"
      - "dashboard/src/**/*.{ts,tsx}"
      - "dashboard/src/**/*.test.{ts,tsx}"
      - "dashboard/package.json"
      - "dashboard/vite.config.ts"
      - "dashboard/vitest.config.ts"
  workflow_dispatch:

jobs:
  # ==================== PYTHON TESTS ====================
  python-unit-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The regression gate diffs the base against HEAD, so it needs both
          # refs present; the default shallow clone has neither.
          fetch-depth: 0

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      # Issue #119. ruff ran nowhere in CI until now: the only mention of it
      # in .github was a checkbox in the PR template, which is a check that
      # passes because a human ticked it. main was brought to 0 findings in
      # #220, so this step defends that rather than establishing it.
      #
      # Whole tree on purpose. `ruff check src tests` is also green, but
      # scoping to it would be green-by-narrowing — the DoD forbids that, and
      # the 10 findings this step's branch fixed were all in `scripts/`,
      # exactly the code a narrower scope would have left unguarded.
      - name: Lint (ruff, whole tree)
        if: matrix.python-version == '3.11'
        run: uv run ruff check .

      # Issue #91: the compile-time half of the port contract. A Protocol is
      # checked statically, not at runtime, so adapter drift (missing `tenant`
      # parameter, wrong return type) is invisible to pytest — only mypy sees
      # it. Its own step so a failure is distinguishable from a test failure.
      # Scope (domain/ + the GitHub adapter) comes from [tool.mypy] in
      # pyproject.toml; one matrix leg is enough — python_version is pinned
      # in the config, so both legs would run the identical check.
      - name: Static type check (mypy over domain/ and github/)
        if: matrix.python-version == '3.11'
        run: uv run mypy

      # The step above is bounded by [tool.mypy] `files` — 21 of them. A PR
      # adding type errors to bronze/ or silver/ is outside that scope and
      # passes it. That is not hypothetical: Phase 1's real type regressions
      # were +37 mypy errors in exactly such directories, invisible behind a
      # run reporting "Success". check_regressions.py is what covers the rest,
      # over the whole codebase with the project config neutralised, gating on
      # the per-file delta rather than on totals.
      #
      # PR-only: it compares a base to a head, and a push to main has no base.
      # On a pull_request, actions/checkout leaves HEAD at GitHub's merge
      # commit, so base-tip vs HEAD is precisely the PR's own contribution.
      - name: Regression gate (per-file ruff + mypy delta vs the base)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          uv run python scripts/check_regressions.py \
            --base "origin/$GITHUB_BASE_REF" --head HEAD

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit \
            --cov=coops \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=60 \
            -v

      - name: Upload Python coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Comment Python coverage on PR
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 60

  # ==================== FRONTEND TESTS ====================
  frontend-unit-tests:
    name: Frontend Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ "20", "22" ]

    defaults:
      run:
        working-directory: ./dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Issue #119: its own step, not a side effect of `npm run build`, so a
      # type error is distinguishable from a build failure and surfaces before
      # deploy rather than at it.
      #
      # `npm run lint` and `npm run format:check` are NOT here yet and that is
      # deliberate: on this commit they exit 1 (314 eslint errors, 88 files
      # unformatted). Adding them now would make main red rather than keep it
      # green. Tracked separately; this step is the part of #119 that can be
      # enforced honestly today.
      - name: Type check (tsc -b)
        run: npx tsc -b

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload Frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-node-${{ matrix.node-version }}
          path: |
            dashboard/coverage/
          retention-days: 30

      - name: Comment Frontend coverage on PR
        if: github.event_name == 'pull_request' && matrix.node-version == '20'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./dashboard
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  # ==================== SUMMARY ====================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [python-unit-tests, frontend-unit-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Python tests: ${{ needs.python-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend tests: ${{ needs.frontend-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.python-unit-tests.result }}" != "success" ] || [ "${{ needs.frontend-unit-tests.result }}" != "success" ]; then
            echo "Some tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "All tests passed!" >> $GITHUB_STEP_SUMMARY
          fi

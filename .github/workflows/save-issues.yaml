name: Salvar informações de issues

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  fetch-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'poetry'

      - name: Install package
        run: poetry install --no-interaction

      - name: Buscar issues e salvar JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poetry run python -m coops.etl.fetch_issues

      - name: Commitando mudanças para o repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/extractions/extractions.json
          if ! git diff --cached --quiet; thenfa
            git commit -m "[GITHUB_ACTIONS_BOT] Adicionando o arquivo extractions.json ao repositório"
            git push
          else
            echo "Nenhuma mudança para commitar. Pulando commit e push."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
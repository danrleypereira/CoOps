name: Bronze Layer - Data Extraction

on:
  workflow_dispatch:
    inputs:
      max_commits_per_repo:
        description: 'Cap on commits fetched per repo (blank = no cap, full extraction). Useful for quick local tests via act.'
        required: false
        type: string
        default: ''
      skip_structure:
        description: 'Skip repository structure extraction (faster)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 5 AM UTC
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  extract-bronze-data:
    runs-on: ubuntu-latest

    outputs:
      bronze-completed: ${{ steps.extraction.outputs.completed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Verify organization is valid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER:-${{ github.repository_owner }}}

          TYPE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/$OWNER | jq -r .type)

          if [ "$TYPE" = "Organization" ]; then
            echo "[SUCCESS] Valid organization: $OWNER"
          else
            echo "[ERROR]: $OWNER is not an organization (type: $TYPE)"
            exit 1
          fi

      - name: Create data directories
        run: |
          mkdir -p data/bronze data/silver data/gold
          mkdir -p cache
          echo "[INFO] Created data layer directories"

      - name: Extract Bronze layer data
        id: extraction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}
          MAX_COMMITS_PER_REPO: ${{ github.event.inputs.max_commits_per_repo }}
          SKIP_STRUCTURE: ${{ github.event.inputs.skip_structure }}
        run: |
          echo "[INFO] Starting Bronze layer extraction..."
          # Use GraphQL for commits to avoid per-commit REST stats calls
          # Full history by default; max_commits_per_repo/skip_structure inputs
          # allow a fast, limited run when dispatched manually (e.g. via act).
          ARGS=(--cache --commits-method graphql)
          if [ -n "$MAX_COMMITS_PER_REPO" ]; then
            ARGS+=(--max-commits-per-repo "$MAX_COMMITS_PER_REPO")
          fi
          if [ "$SKIP_STRUCTURE" = "true" ]; then
            ARGS+=(--skip-structure)
          fi
          poetry run coops-bronze "${ARGS[@]}"

          # Check if files were generated
          if [ "$(find data/bronze -name '*.json' | wc -l)" -gt 0 ]; then
            echo "[SUCCESS] Bronze extraction completed successfully"
            echo "completed=true" >> $GITHUB_OUTPUT
          else
            echo "[ERROR] No files generated in bronze layer"
            echo "completed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate data registry
        if: steps.extraction.outputs.completed == 'true'
        run: |
          echo "[INFO] Generating data registry..."
          poetry run coops-registry

      - name: List generated files
        if: steps.extraction.outputs.completed == 'true'
        run: |
          echo "[INFO] Bronze layer files generated:"
          find data/bronze -name '*.json' -type f | sort | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "  - $file ($size)"
          done

      - name: Commit and push Bronze data
        if: steps.extraction.outputs.completed == 'true' && !env.ACT
        run: |
          git config --global user.name "CoOps Bot"
          git config --global user.email "coops@dwcorp.com.br"

          # Ensure we're on a branch (handle detached HEAD state)
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" = "HEAD" ]; then
            # In detached HEAD state, checkout the appropriate branch
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BRANCH="${{ github.event.pull_request.head.ref }}"
              echo "Checking out PR branch: $BRANCH"
              git checkout -B "$BRANCH"
            else
              BRANCH="${GITHUB_REF#refs/heads/}"
              echo "Checking out branch: $BRANCH"
              git checkout -B "$BRANCH"
            fi
          else
            echo "Already on branch: $CURRENT_BRANCH"
          fi

          git add data/bronze/ data/master_registry.json data/data_catalog.json

          if ! git diff --cached --quiet; then
            git commit -m "[Bronze] Update extracted GitHub metrics data

            - Extracted organization data from GitHub API
            - Generated $(find data/bronze -name '*.json' | wc -l) bronze layer files
            - Updated data registry and catalog
            - Triggered by: ${{ github.event_name }}"

            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD
          else
            echo "No changes to commit in Bronze layer"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-silver:
    needs: extract-bronze-data
    if: needs.extract-bronze-data.outputs.bronze-completed == 'true'
    uses: ./.github/workflows/silver-process.yaml
    secrets: inherit

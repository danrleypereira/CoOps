[project]
name = "coops"
version = "1.1.0.dev0"
description = "Collaboration & Ops metrics for GitHub organizations — a Medallion (Bronze → Silver → Gold) ETL pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "CoOps Contributors" },
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "pymongo>=4.6,<5",
]

# Installed by default with `uv sync`; not published as a package extra.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.0",
]

[project.scripts]
coops-bronze = "coops.etl.bronze_extract:main"
coops-silver = "coops.etl.silver_process:main"
coops-gold = "coops.etl.gold_process:main"
coops-aggregate = "coops.etl.gold_aggregate:main"
coops-registry = "coops.etl.registry_manager:main"
coops-corpus = "coops.raw_capture.cli:main"

# uv_build finds the package in src/coops from the project name.
[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-v",
    "--tb=short",
    "--cov=coops",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = [
    "tests/unit",
    "tests/integration",
]

[tool.coverage.run]
source = ["coops"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*cleanup_event_data.py",
    "src/coops/ai_analysis/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

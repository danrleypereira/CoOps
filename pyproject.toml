[project]
name = "coops"
version = "1.1.0.dev0"
description = "Collaboration & Ops metrics for GitHub organizations — a Medallion (Bronze → Silver → Gold) ETL pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "CoOps Contributors" },
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "pymongo>=4.6,<5",
]

# Installed by default with `uv sync`; not published as a package extra.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.0",
    "mypy>=2.3.1",
    # Exact pin, not a range: `ruff check src tests` must mean the same thing
    # on every machine and inside both arms of scripts/check_regressions.py,
    # whose whole point is comparing two trees with ONE instrument. A
    # floating ruff changes rule behaviour between runs and turns the
    # per-file delta into noise (issue #119). Bump deliberately, both here
    # and in [tool.ruff] required-version below.
    "ruff==0.16.9",
]

[project.scripts]
coops-bronze = "coops.etl.bronze_extract:main"
coops-silver = "coops.etl.silver_process:main"
coops-gold = "coops.etl.gold_process:main"
coops-aggregate = "coops.etl.gold_aggregate:main"
coops-registry = "coops.etl.registry_manager:main"
coops-corpus = "coops.raw_capture.cli:main"

# uv_build finds the package in src/coops from the project name.
[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-v",
    "--tb=short",
    "--cov=coops",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = [
    "tests/unit",
    "tests/integration",
]

[tool.coverage.run]
source = ["coops"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*cleanup_event_data.py",
    "src/coops/ai_analysis/*",
]

# Static half of the port contract (issue #91): a Protocol is checked at
# compile time, not at runtime — `isinstance` on a @runtime_checkable
# Protocol only verifies that method *names* exist — so an adapter that
# drifts from a port (missing `tenant` parameter, renamed argument, wrong
# return type) needs a type checker to be caught. Contract tests (#55)
# remain the runtime guarantee; this is the compile-time half.
[tool.mypy]
strict = true
# requires-python floor: the CI matrix runs 3.10 and 3.11, so check against
# the oldest semantics any supported interpreter may execute.
python_version = "3.10"
# Resolve `coops` imports against this source tree, not the installed dist
# (which has no py.typed marker) — otherwise any file checked outside src/
# (a scratch adapter, a future tests/ run) sees the ports as Any and the
# protocol check silently does nothing.
mypy_path = "src"
# Scoped to the Phase 1 port/adapter boundary only: a strict run over the
# pre-ports layers starts at 348 errors today and would drown the signal
# (the follow-up widens these as Phases 2 and 3 move code behind ports).
files = [
    "src/coops/domain",
    "src/coops/github",
    "src/coops/storage",
]
# The same pre-ports packages, spelled out so an explicit `uv run mypy src/`
# (or an IDE run over the tree) fails on nothing this issue does not migrate.
# `files` above already keeps a bare `uv run mypy` scoped; this is the belt
# to its braces. `storage` left out of the alternation since #41: the file
# adapter is strict-clean, and an adapter drifting from `StoragePort` must
# not pass unnoticed.
exclude = "src/coops/(bronze|silver|gold|utils|etl|ai_analysis|infrastructure|raw_capture)/"

# `raw.py`'s `import pymongo` follows into the standalone `bson` package,
# whose `binary.py` imports numpy under TYPE_CHECKING — and numpy's bundled
# stubs use `type` statements that cannot parse under the
# `python_version = "3.10"` floor above (they need >= 3.12). That aborts the
# whole run ("errors prevented further checking"), so `bson` — the one leaf
# that pulls numpy in — is skipped. Nothing in the checked packages
# (domain, github, storage) touches bson directly, and pymongo's own
# annotations (collections, replace_one, find_one) stay fully typed; only
# bson-typed spots degrade to Any. Revisit when the floor moves to 3.12.
[[tool.mypy.overrides]]
module = ["bson", "bson.*"]
follow_imports = "skip"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# The lint gate. Pinned to an explicit select so a ruff upgrade cannot widen
# the gate on its own: a new rule joins only when this list says so, and any
# finding it then reports is unambiguously new (chore/ruff-green-baseline).
[tool.ruff]
# Same floor as [tool.mypy] python_version: the CI matrix runs 3.10–3.12, so
# UP fixes must not emit syntax an oldest-supported interpreter rejects.
target-version = "py310"
# First-party resolution (import sorting, TID) — the package lives in src/.
src = ["src", "tests"]
line-length = 100
# Pins ruff *behaviour* to the version pinned in the dev group (#221). Merged
# here from #221's own [tool.ruff]: TOML rejects duplicate keys, so the two
# blocks cannot coexist — a cherry-pick that reported "no conflicts" still
# produced a file ruff refuses to parse ("duplicate key"), because git merged
# them as text and text does not know what a table is.
required-version = "0.16.9"

[tool.ruff.lint]
select = [
    # pycodestyle errors only. E1/E2/E5 and W (whitespace, line length) are
    # the formatter's job; this repo has not adopted `ruff format` (a full
    # reformat is its own change), so style rules would be ~2.2k findings of
    # noise the gate cannot act on.
    "E4",
    "E7",
    "E9",
    "F",    # pyflakes: unused imports/locals, f-string without placeholders
    "I",    # import order
    "UP",   # typing modernisation at the py310 floor
    "B",    # bugbear: loop-variable misuse, zip without strict=
    "C4",   # comprehension hygiene: double cast, needless dict comprehension
    "RET",  # return hygiene: dead branches, needless assignment-before-return
    "SIM",  # simplify: nested with/if, `in d.keys()`
    "RUF",  # ruff-specific: unsorted __all__, unused unpacked variables
    "DTZ",  # naive datetimes — issue #143's defect class (persisted local
            # wall-clock timestamps); kept whole so new naive writes cannot
            # enter quietly. Deliberate naive reads carry a reasoned noqa.
    "BLE",  # blind `except Exception` — issue #212's defect class (tests that
            # cannot fail). Deliberate breadth (CLI boundary, per-item
            # resilience) carries a reasoned noqa.
    "S",    # flake8-bandit: try/except/pass, exec, insecure hashes. S101
            # (assert) is ignored for tests/ below — asserts are the point.
    "EXE",  # shebang hygiene: a shebang on a non-executable file lies
    "FURB", # refurb: slice-to-remove-suffix, `x or y` simplifications
    "PLC0414", # explicit re-export (`X as X`). Not a style preference: the
            # gate in scripts/check_regressions.py measures with ruff's own
            # default rules, which include this one, so a noqa for it is
            # load-bearing THERE while reading as RUF100 (unused) here. Select
            # it so the project and the gate agree about one rule instead of
            # disagreeing silently — found when the gate flagged storage/raw.py
            # 0 -> 1 after this branch removed that noqa as redundant.
]
# Not selected, deliberately (all measured, not assumed):
# - E1/E2/E5/W, E501 — formatter territory; adopting one is a separate change.
# - PL (455 findings today) — dominated by PLR2004 magic-value comparisons in
#   tests and complexity thresholds (PLR09xx) this codebase was never tuned
#   to; enabling it would drown the gate on day one.
# - TRY (96) — opinionated raise-from/logging discipline; would force
#   exception-handling rewrites across the API client in a lint pass.
# - PTH (153) — os.path → pathlib migration; a real but structural change.
# - PT (46) — pytest style (parametrize idioms); test churn without defects.
# - T20 (194) — the ETL is a console program; printing is its interface.
# - ANN/D — un-annotated and under-documented legacy layers; the mypy
#   boundary (domain/github/storage) is where typing is enforced today.

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is the assertion mechanism of a test
    "DTZ",  # fixtures and expected values are built in the pipeline's data
            # model: naive UTC, the shape GitHub's own timestamps parse into
            # (see parse_github_date). Making them aware would test a
            # different model than the code under test runs on.
    "S105", # dummy credentials: fixtures pass fake tokens by design; there is
    "S106", # no real secret in a test, and the parameter name is the API's.
    "S603", # subprocess with a non-literal argv: scripts/check_regressions.py
    "S607", # is a CLI, so its tests must invoke it as one. The argv is built
            # in the test from its own constants — there is no untrusted input
            # to check for, which is what S603 exists to catch. Added when #221
            # landed the gate and its tests after this baseline was measured.
]
